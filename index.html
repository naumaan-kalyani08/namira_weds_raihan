     Scroll drives: approach (75% to 95% zoom) > fit > doors swing open in 3D (rotateY) > push through > Welcome. */
  color-scheme: dark;
  --night:#0e0805;
  --umber:#2c190f;
  --umber-hi:#4a2d1d;
  --brass:#d6a64a;
  --brass-hi:#f6dd95;
  --ivory:#f6ecd2;
  --ember:#ffc870;
  --display:'Amiri','Noto Naskh Arabic',Georgia,serif;
  --kufi:'Reem Kufi','Segoe UI',system-ui,sans-serif;
  --fit:min(calc(100vw - 32px),80vh);
}
@supports (height:1svh){:root{--fit:min(calc(100vw - 32px),80svh)}}

html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}

body{margin:0;background:var(--night);color:var(--ivory);font-family:var(--kufi)}

.scene{
  position:relative;height:100vh;height:100svh;overflow:hidden;
  display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 58%, var(--umber-hi) 0%, var(--umber) 42%, var(--night) 100%);
}
.halo,.veil{position:absolute;pointer-events:none}
.halo{
  left:50%;top:56%;width:calc(var(--fit)*1.6);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, color-mix(in srgb,var(--ember) 55%,transparent), transparent 72%);
  opacity:.25;
}
.veil{
  inset:0;
  background:radial-gradient(64% 50% at 50% 50%, color-mix(in srgb,var(--night) 82%,transparent), transparent 80%);
  opacity:0;
}

.stage{
  position:relative;z-index:1;
  width:var(--fit);aspect-ratio:592/740;max-width:100%;
  transform-origin:50% 55%;transform:scale(.75);
}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
.interior{z-index:1}
.doors{position:absolute;inset:0;z-index:2;perspective:calc(var(--fit)*2.4);pointer-events:none}
.leaf{position:absolute;top:40%;height:30.9459%;width:12.8378%;will-change:transform}
.leaf i{position:absolute;inset:0;display:block;background-size:100% 100%;background-repeat:no-repeat;filter:brightness(1)}
.leaf--l{left:37.1622%;transform-origin:0% 50%}.leaf--l i{background-image:var(--leafL)}
.leaf--r{left:50%;transform-origin:100% 50%}.leaf--r i{background-image:var(--leafR)}
img.frame{object-fit:fill;user-select:none;-webkit-user-drag:none}
.spill{z-index:5;pointer-events:none;mix-blend-mode:screen}
.frame{z-index:4}
#spill{opacity:0}

.welcome{
  position:absolute;inset:0;z-index:3;
  display:grid;place-content:center;justify-items:center;
  gap:clamp(8px,2vh,18px);text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;
}
.welcome .ch,.welcome .rest{opacity:0}
.ch{display:inline-block;will-change:transform,opacity,filter}
.w-ar{margin:0;font-family:var(--display);font-size:clamp(1.7rem,5.2vw,3.2rem);line-height:1.3;color:var(--brass-hi)}
.w-en{
  margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(3.4rem,16vw,11rem);line-height:1;letter-spacing:.01em;color:var(--ivory);
  text-shadow:0 2px 40px color-mix(in srgb,var(--night) 70%,transparent);
}
.w-div{width:min(220px,50vw);height:auto;display:block}
.w-sub{margin:0;font-size:clamp(.7rem,1.9vw,.85rem);letter-spacing:.28em;text-transform:uppercase;color:color-mix(in srgb,var(--ivory) 78%,transparent)}

.hint{
  position:absolute;z-index:5;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:grid;justify-items:center;gap:8px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:color-mix(in srgb,var(--ivory) 85%,transparent);text-shadow:0 1px 8px var(--night);
}
.hint i{width:1px;height:34px;background:linear-gradient(var(--brass-hi),transparent);transform-origin:top;animation:drip 1.9s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);opacity:1}70%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.hud{
  position:absolute;z-index:5;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:14px;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:color-mix(in srgb,var(--ivory) 75%,transparent);pointer-events:none;
}
.hud b{font-weight:600;color:var(--brass-hi);font-variant-numeric:tabular-nums;letter-spacing:.12em}

.static .welcome .ch,.static .welcome .rest{opacity:1}
.static .stage{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.hint i{animation:none;transform:none}}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:3px}

  if (window.Lenis && !reduce) {
    try {
      var lenis = new Lenis({ duration: 1.15, smoothWheel: true });
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
      gsap.ticker.lagSmoothing(0);
    } catch (e) {}
  }

  var stage = document.querySelector('.stage');
  var L = document.querySelector('.leaf--l');
  var R = document.querySelector('.leaf--r');
  var phaseEl = document.getElementById('phase');
  var zoomEl = document.getElementById('zoom');
  var doorsEl = document.getElementById('doors');
  var letters = document.querySelectorAll('.welcome .ch');
  var rest = document.querySelectorAll('.welcome .rest');
  var shown = false;

  gsap.set(stage, { scale: 0.75, transformOrigin: '50% 55%' });
  gsap.set([L, R], { rotationY: 0 });

  function reveal(on) {
    var M = window.Motion || window.motion;
    try {
      if (M && M.animate) {
        if (on) {
          M.animate(letters, { opacity: [0, 1], transform: ['translateY(30px)', 'translateY(0px)'], filter: ['blur(10px)', 'blur(0px)'] },
            { duration: 1, delay: M.stagger ? M.stagger(0.06) : 0, ease: [0.22, 1, 0.36, 1] });
          M.animate(rest, { opacity: [0, 1], transform: ['translateY(14px)', 'translateY(0px)'] },
            { duration: 0.9, delay: 0.55, ease: [0.22, 1, 0.36, 1] });
        } else {
          M.animate(letters, { opacity: 0 }, { duration: 0.25 });
          M.animate(rest, { opacity: 0 }, { duration: 0.25 });
        }
        return;
      }
    } catch (e) {}
    if (on) {
      gsap.fromTo(letters, { opacity: 0, y: 30 }, { opacity: 1, y: 0, stagger: 0.06, duration: 0.9, ease: 'power3.out', overwrite: true });
      gsap.fromTo(rest, { opacity: 0, y: 14 }, { opacity: 1, y: 0, delay: 0.55, duration: 0.8, ease: 'power3.out', overwrite: true });
    } else {
      gsap.to([letters, rest], { opacity: 0, duration: 0.25, overwrite: true });
    }
  }

  function sync() {
    var p = tl.progress();
    phaseEl.textContent = p < 0.267 ? 'Approach' : p < 0.333 ? 'Fit' : p < 0.7 ? 'Open' : 'Enter';
    zoomEl.textContent = Math.round(gsap.getProperty(stage, 'scale') * 100) + '%';
    doorsEl.textContent = Math.round(gsap.getProperty(L, 'rotationY')) + '°';
    var show = p > 0.83;
    if (show !== shown) { shown = show; reveal(show); }
  }

  var tl = gsap.timeline({
    defaults: { ease: 'none' },
    onUpdate: sync,
    scrollTrigger: { trigger: '#scene', start: 'top top', end: '+=600%', pin: true, scrub: 0.6, anticipatePin: 1, invalidateOnRefresh: true }
  });

  tl
    // 1. Approach: 75% to 95% so the gate fits the viewport
    .to(stage, { scale: 0.95, ease: 'power1.inOut', duration: 3.2 }, 0)
    .to('.halo', { opacity: 0.5, duration: 3.2 }, 0)
    .to('#hint', { opacity: 0, duration: 0.6 }, 0)
    // 2. Open: both leaves swing in depth (rotateY) around their outer hinges
    .to(L, { rotationY: 100, ease: 'power2.inOut', duration: 4.4 }, 4)
    .to(R, { rotationY: -100, ease: 'power2.inOut', duration: 4.4 }, 4)
    .to('.leaf i', { filter: 'brightness(0.45)', duration: 4.4 }, 4)
    .to('#inner', { scale: 1.14, svgOrigin: '296 470', ease: 'power1.inOut', duration: 4.4 }, 4)
    .to('#spill', { opacity: 1, duration: 3 }, 4.4)
    .to('.halo', { opacity: 1, duration: 4 }, 4)
    // 3. Enter: push through the opening, gate fades, Welcome takes over
    .to(stage, { scale: 4.6, ease: 'power2.in', duration: 2.8 }, 8.4)
    .to(stage, { opacity: 0, ease: 'power1.in', duration: 1.4 }, 9.7)
    .to('.halo', { opacity: 0.25, duration: 1.5 }, 9.7)
    .to('.veil', { opacity: 1, duration: 1.5 }, 9.5)
    .to({}, { duration: 1 }, 11);

  window.addEventListener('load', function () { ScrollTrigger.refresh(); });
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { ScrollTrigger.refresh(); }); }
})();

</script>

</body></html>
